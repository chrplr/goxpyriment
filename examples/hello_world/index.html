<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>goxpyriment — Hello World</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { display: block; }
  </style>
  <!--
    SDL3.js must be loaded first — it sets up window.Module, window.HEAPU8,
    window.stackAlloc, window.runtimeInitialized, and all window._SDL_* / _TTF_*
    symbols that the go-sdl3 WASM bindings call into.

    Build SDL3.js + SDL3.wasm with Emscripten (see docs/WASM.md).
    Once available, uncomment the line below:
  -->
  <script src="SDL3.js"></script> 
  <script src="wasm_exec.js"></script>
</head>
<body>
<script>
  // Wait for the Emscripten SDL3 module to finish initialising before
  // starting the Go WASM binary, so that window.Module._SDL_Init etc. exist.
  function startGo() {
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
      .then(result => go.run(result.instance))
      .catch(e => console.error("Go WASM error:", e));
  }

  if (typeof Module !== "undefined" && Module.runtimeInitialized) {
    startGo();
  } else if (typeof Module !== "undefined") {
    Module.onRuntimeInitialized = startGo;
  } else {
    // SDL3.js not loaded — running without Emscripten (will fail at SDL init)
    console.warn("SDL3.js not loaded; add <script src=\"SDL3.js\"> before wasm_exec.js");
    startGo();
  }
</script>
</body>
</html>
