category: experiment
description: "MEG reading paradigm: 12-word sentences and matched nonword strings from the EvLab language localizer, presented word by word (RSVP, 450 ms per word, no gap) in an event-related design, every word onset marked on the MEG STI channel with an 8-bit code giving condition and word position (sentences 1-12, nonwords 21-32), plus photodiode square. A disc after each item asks for a button press to keep the participant alert. The 139 + 139 items are intermixed and dealt into 4 runs of about 8 min (selected with -run), reproducibly per subject; the 101 + 101 training items serve as practice (-practice)."
reference: "Fedorenko, E., Hsieh, P.-J., Nieto-Castañón, A., Whitfield-Gabrieli, S., & Kanwisher, N. (2010). New method for fMRI investigations of language: defining ROIs functionally in individual subjects. Journal of Neurophysiology, 104(2), 1177-1194."
