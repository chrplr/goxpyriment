[project]
site_name = "goxpyriment"
site_description = "A Go framework for behavioral and psychological experiments"
site_url = "https://chrplr.github.io/goxpyriment"
repo_url = "https://github.com/chrplr/goxpyriment"
repo_name = "chrplr/goxpyriment"
copyright = """
Copyright &copy; 2026 Christophe Pallier &middot; Apache License 2.0 &middot;
Cite as <a href="https://doi.org/10.5281/zenodo.19200598">doi:10.5281/zenodo.19200598</a>
"""

docs_dir = "docs"

# Presentational overrides only (landing cards + styling); see overrides/main.html.
extra_css = ["stylesheets/extra.css"]

# Each inline table is a single navigation entry. Sections nest an array of
# inline tables. TOML requires each inline table to stay on one line.
nav = [
  { Home = "index.md" },
  { "Start here" = [ { Installation = "Installation.md" }, { "Installing a Go development environment" = "Installing-a-development-environment.md" }, { "Creating Your Own Experiment" = "CreatingYourOwnExperiment.md" }, { "Getting Started" = "GettingStarted.md" } ] },
  { Gallery = [ { "Gallery of Examples" = "GalleryOfExamples.md" }, { "Pre-built examples" = "pre-built-examples.md" } ] },
  { "User Manual" = "UserManual.md" },
  { API = "API.md" },
  { Misc = [ { "Coming from other tools" = [ { "Migration Guide" = "MigrationGuide.md" }, { "Comparison with PsychoPy" = "ComparisonWithPsychoPy.md" }, { "Go vs Python" = "gemini-about-go-vs-python.md" } ] }, { "Timing & performance" = [ { "Timing Tests" = "TimingTests.md" }, { "Timing mega-study comparison" = "TimingMegastudyComparison.md" }, { "Frame syncing" = "frame-syncing.md" }, { "Trigger jitter for EEG/MEG" = "TriggerJitterForEEGandMEG.md" } ] }, { "Platform setup" = [ { "Setting priority under Linux" = "SettingPriorityUnderLinux.md" }, { "Setting priority under Windows" = "SettingPriorityUnderWindows.md" }, { "Setting priority under macOS" = "SettingPriorityUnderMacOS.md" }, { "Fullscreen & high pixel density" = "Fullscreen_high_pixel_density.md" }, { "Linux virtual console" = "LinuxVirtualConsoleSDL.md" } ] }, { "Media & browser" = [ { "Movies / media" = "MediaMovies.md" }, { "WASM build" = "WASM.md" }, { "Deploying on a JATOS server" = "DeployingOnAJatosServer.md" } ] }, { "Sharing & packaging" = [ { "Packaging your experiment" = "How_to_package_your_experiment.md" }, { "Standalone example repo" = "StandaloneExampleRepo.md" } ] }, { "Under the hood" = [ { "How experiment.go works" = "how-experiment-go-works.md" }, { "Library usage" = "library_usage.md" }, { "Viewing docs locally" = "ViewingDocsLocally.md" } ] } ] },
]

[project.theme]
name = "material"
custom_dir = "overrides"
font = { text = "Inter", code = "JetBrains Mono" }
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "navigation.tabs",
  "navigation.top",
  "navigation.sections",
  "navigation.footer",
  "navigation.tracking",
  "navigation.path",
  "navigation.instant",
  "toc.follow",
  "content.code.copy",
  "content.code.annotate",
  "search.highlight",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

# Python-Markdown extensions. pymdownx.* entries may be nested under a
# [project.markdown_extensions.pymdownx] table without the "pymdownx." prefix.
[project.markdown_extensions]
admonition = {}
toc = { permalink = true }

[project.markdown_extensions.pymdownx]
details = {}
superfences = {}
inlinehilite = {}
highlight = { anchor_linenums = true }
tabbed = { alternate_style = true }

[project.plugins]
search = {}

# Footer links (icons shown next to the copyright line).
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/chrplr/goxpyriment"
name = "GitHub repository"

[[project.extra.social]]
icon = "material/forum-outline"
link = "https://groups.google.com/a/pallier.org/g/goxpyriment"
name = "Google group forum"

[[project.extra.social]]
icon = "material/bug-outline"
link = "https://github.com/chrplr/goxpyriment/issues"
name = "Report a bug"
