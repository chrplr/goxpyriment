name: Build example installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-all:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      # The secrets context cannot be used in an `if:` directly, so the
      # presence of R2 credentials is hoisted into an env var. Forks and runs
      # made before the secrets exist simply skip the publishing steps.
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build all platforms
        run: bash examples/installers/build-all-platforms.sh
        env:
          # Keep the staging directories so each app can be zipped on its own.
          KEEP_STAGE: "1"

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: examples/installers/goxpyriment-examples-windows-x86_64.zip

      - name: Upload macOS arm64 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: examples/installers/goxpyriment-examples-macos-arm64.zip

      - name: Upload Linux x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: examples/installers/goxpyriment-examples-linux-x86_64.tar.gz

      - name: Upload Linux arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: examples/installers/goxpyriment-examples-linux-arm64.tar.gz

      # --- individual downloads on downloads.pallier.org ---------------------
      # A visitor who wants one experiment should not have to fetch a ~500 MB
      # bundle containing 113 others. These steps repackage the binaries the
      # job has already built, so they cost transfer time but no build time.

      - name: Package each app individually
        if: env.HAS_R2 == 'true'
        run: bash examples/installers/package-per-app.sh

      - name: Generate the download pages
        if: env.HAS_R2 == 'true'
        run: |
          # On a workflow_dispatch from a branch, GITHUB_REF_NAME is a branch
          # name, which the page must not label as a release.
          TAG=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; fi
          go run ./cmd/gen-download-index \
            -root _build/r2 \
            -commit "${GITHUB_SHA}" \
            -tag "${TAG}"
          go run ./cmd/gen-download-index \
            -redirect "${GITHUB_SHA}" \
            -out _build/redirect.html

      - name: Publish to Cloudflare R2
        if: env.HAS_R2 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          # A build is ~2.4 GB of per-app zips (the collection archives live
          # on the GitHub release, not here), so two fit in R2's 10 GB free
          # tier: 4.8 GB steady, peaking near 7.2 GB while a new build lands.
          KEEP: "2"
        run: bash examples/installers/publish-to-r2.sh

  create-release:
    runs-on: ubuntu-latest
    needs: [build-all]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum \
            goxpyriment-examples-windows-x86_64.zip \
            goxpyriment-examples-macos-arm64.zip \
            goxpyriment-examples-linux-x86_64.tar.gz \
            goxpyriment-examples-linux-arm64.tar.gz \
            > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Goxpyriment examples ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/goxpyriment-examples-windows-x86_64.zip
            artifacts/goxpyriment-examples-macos-arm64.zip
            artifacts/goxpyriment-examples-linux-x86_64.tar.gz
            artifacts/goxpyriment-examples-linux-arm64.tar.gz
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
